name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Télécharger les polices
        run: |
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          curl -fsSL -o serif.ttf "https://github.com/google/fonts/raw/main/ofl/fraunces/Fraunces%5BSOFT,WONK,opsz,wght%5D.ttf" || rm -f serif.ttf
          curl -fsSL -o sans.ttf "https://github.com/google/fonts/raw/main/ofl/worksans/WorkSans%5Bwght%5D.ttf" || rm -f sans.ttf

      - name: Compiler
        run: gradle :app:assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Essentiel.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Essentiel ${{ github.run_number }}
          files: Essentiel.apk
